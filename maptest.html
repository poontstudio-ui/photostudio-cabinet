/* TH:BEGIN — тема интерфейса: ночная/дневная (_dev/theme.css) */
:root{
  --on-solid:#fff;color-scheme:light;
  --hover:#e7e9ed; --fill-muted:#e4e6ea; --accent-soft-2:#c3dafb;
  --amber-line:#ecd9ae; --green-line:#bfe3cd; --green-ink:#0e6b3d; --amber-ink:#80540a;
  --go-hover:#d9efe2; --stop-hover:#f7dede; --red-dark:#b73030;
  --stripe:rgba(20,22,28,.05); --stripe-2:rgba(20,22,28,.015);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171b; --surface:#1e2127; --surface-2:#242830;
  --line:#2e333c; --line-strong:#3e4550; --border:#2e333c; --border-strong:#3e4550;
  --text:#eceef2; --text-2:#aab1bc; --text-3:#7c838f;
  --accent:#6aa8ff; --accent-dark:#8fbcff; --accent-bg:#1c2a40; --accent-dim:#2a4468;
  --accent-soft:#243e63; --sel-fill:#243e63;
  --blue:#6aa8ff; --blue-dark:#8fbcff; --blue-bg:#1c2a40;
  --green:#7fd3a0; --green-bg:#183024;
  --red:#ff8a80; --red-bg:#3a1f1d;
  --amber:#ffc06a; --amber-bg:#3a2d16;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
  --shadow-lift:0 -4px 16px rgba(0,0,0,.45);
  --on-solid:#10141a;
  --hover:#2c313a; --fill-muted:#2c313a; --accent-soft-2:#2c4a75;
  --amber-line:#5a4519; --green-line:#24543a; --green-ink:#7fd3a0; --amber-ink:#ffc06a;
  --go-hover:#1f4030; --stop-hover:#4a2724; --red-dark:#ffa59d;
  --stripe:rgba(255,255,255,.035); --stripe-2:rgba(255,255,255,.01);
}

</style>
<script>/* TH:BEGIN — тема интерфейса: ночная/дневная (_dev/theme.js) */
(function(){
  var KEY = 'poont.theme';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function saved(){ try{ var v = localStorage.getItem(KEY); return v === 'dark' || v === 'light' ? v : null; }catch(e){ return null; } }
  function system(){
    var tg = window.Telegram && window.Telegram.WebApp;
    if(tg && (tg.colorScheme === 'dark' || tg.colorScheme === 'light') && tg.initData) return tg.colorScheme;
    try{ return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }catch(e){ return 'light'; }
  }
  function get(){ return saved() || system(); }
  function paintButtons(t){
    var btns = document.querySelectorAll('[data-theme-toggle]');
    for(var i = 0; i < btns.length; i++){
      var b = btns[i], night = t === 'dark';
      // Кнопка показывает, на что переключит: ночью — солнце, днём — луна.
      var label = night ? 'Дневная тема' : 'Ночная тема';
      b.innerHTML = (night ? SUN : MOON) + (b.hasAttribute('data-label') ? '<span>' + label + '</span>' : '');
      b.setAttribute('aria-label', label); b.title = label;
    }
  }
  function apply(){
    var t = get(), root = document.documentElement;
    root.setAttribute('data-theme', t);
    var tg = window.Telegram && window.Telegram.WebApp;
    if(tg && tg.initData){
      var cs = getComputedStyle(root);
      try{ tg.setBackgroundColor(cs.getPropertyValue('--bg').trim() || (t === 'dark' ? '#15171b' : '#f1f2f4')); }catch(e){}
      try{ tg.setHeaderColor(cs.getPropertyValue('--surface').trim() || (t === 'dark' ? '#1e2127' : '#ffffff')); }catch(e){}
    }
    paintButtons(t);
    try{ window.dispatchEvent(new CustomEvent('poont-theme', { detail: { theme: t } })); }catch(e){}
  }
  function set(t){ try{ localStorage.setItem(KEY, t); }catch(e){} apply(); }
  window.PTheme = { get: get, set: set, toggle: function(){ set(get() === 'dark' ? 'light' : 'dark'); }, apply: apply };
  apply();
  document.addEventListener('DOMContentLoaded', function(){
    apply();
    document.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('[data-theme-toggle]');
      if(b) window.PTheme.toggle();
    });
  });
  // Пока человек сам не выбрал — следуем за системой / за темой Telegram.
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(!saved()) apply(); }); }catch(e){}
  var tg0 = window.Telegram && window.Telegram.WebApp;
  if(tg0 && tg0.onEvent) try{ tg0.onEvent('themeChanged', function(){ if(!saved()) apply(); }); }catch(e){}
})();
/* TH:END */
</script><script>/* MP:BEGIN — карты: Яндекс.Карты JS API v3 со светлой и тёмной схемой (_dev/maps.js) */
(function(){
  // Координаты в v3 — [долгота, широта] (в 2.1 было наоборот).
  var _promise = null, _theme = 'light', _layers = [];
  function curTheme(){ return (window.PTheme && window.PTheme.get && window.PTheme.get()) || _theme; }
  function load(key){
    if(_promise) return _promise;
    if(!key) return Promise.reject(new Error('нет ключа карт'));
    _promise = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://api-maps.yandex.ru/v3/?apikey=' + encodeURIComponent(key) + '&lang=ru_RU';
      s.async = true;
      s.onerror = function(){ _promise = null; reject(new Error('карты не загрузились')); };
      s.onload = function(){
        if(!window.ymaps3){ _promise = null; reject(new Error('карты не загрузились')); return; }
        window.ymaps3.ready.then(function(){
          return window.ymaps3.import('@yandex/ymaps3-controls@0.0.1');
        }).then(function(ctl){ resolve({ y: window.ymaps3, ctl: ctl }); })
          .catch(function(e){ _promise = null; reject(e); });
      };
      document.head.appendChild(s);
    });
    return _promise;
  }
  function baseMap(api, el, location, opts){
    var y = api.y;
    var map = new y.YMap(el, Object.assign({
      location: location,
      // Колесо мыши листает страницу, а не масштабирует карту — как и раньше.
      behaviors: ['drag', 'pinchZoom', 'dblClick'],
    }, opts || {}));
    var scheme = new y.YMapDefaultSchemeLayer({ theme: curTheme() });
    map.addChild(scheme);
    map.addChild(new y.YMapDefaultFeaturesLayer({}));
    var controls = new y.YMapControls({ position: 'right' });
    controls.addChild(new api.ctl.YMapZoomControl({}));
    map.addChild(controls);
    _layers.push({ map: map, scheme: scheme, el: el });
    return map;
  }
  // Смена темы приложения — перекрашиваем уже нарисованные карты.
  window.addEventListener('poont-theme', function(e){
    _theme = e.detail && e.detail.theme || curTheme();
    _layers = _layers.filter(function(l){ return l.el.isConnected; });
    _layers.forEach(function(l){ try{ l.scheme.update({ theme: _theme }); }catch(err){} });
  });
  // Карта одной точки: красная метка, масштаб улицы.
  function studio(key, el, p){
    return load(key).then(function(api){
      el.innerHTML = '';
      var map = baseMap(api, el, { center: [p.lon, p.lat], zoom: 16 });
      var dot = document.createElement('div');
      dot.className = 'pmap-dot';
      map.addChild(new api.y.YMapMarker({ coordinates: [p.lon, p.lat] }, dot));
      return map;
    });
  }
  // Карта каталога: метка-«таблетка» на каждой студии, клик — onPick(студия).
  function catalog(key, el, pts, o){
    return load(key).then(function(api){
      el.innerHTML = '';
      var lons = pts.map(function(s){ return s.lon; }), lats = pts.map(function(s){ return s.lat; });
      var minLon = Math.min.apply(null, lons), maxLon = Math.max.apply(null, lons);
      var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
      // Поля вокруг крайних меток — рамкой расширяем границы (margin у v3 тут не держит).
      var padLon = Math.max((maxLon - minLon) * 0.3, 0.004), padLat = Math.max((maxLat - minLat) * 0.3, 0.003);
      var loc = pts.length > 1
        ? { bounds: [[minLon - padLon, minLat - padLat], [maxLon + padLon, maxLat + padLat]] }
        : { center: [pts[0].lon, pts[0].lat], zoom: 14 };
      // zoomRounding 'auto' — без привязки к целому масштабу: иначе границы «подрезаются» и крайние метки у края.
      var map = baseMap(api, el, loc, { zoomRounding: 'auto' });
      pts.forEach(function(s){
        var pin = document.createElement('div');
        pin.className = 'map-pin pmap-pin';
        pin.textContent = o.label(s);
        pin.addEventListener('click', function(){ o.onPick(s); });
        map.addChild(new api.y.YMapMarker({ coordinates: [s.lon, s.lat] }, pin));
      });
      return map;
    });
  }
  // Карта выбора точки (кабинет): клик ставит метку, метку можно перетащить.
  // p — {lat, lon} или null (центр по умолчанию), o.onChange(lat, lon) — новая точка.
  function picker(key, el, p, o){
    return load(key).then(function(api){
      el.innerHTML = '';
      var has = p && p.lat != null && p.lon != null;
      var map = baseMap(api, el,
        { center: has ? [p.lon, p.lat] : (o.center || [27.5590, 53.9006]), zoom: has ? 16 : 11 },
        { behaviors: ['drag', 'scrollZoom', 'pinchZoom', 'dblClick'] });
      var marker = null;
      function setPin(lat, lon){
        if(marker){ marker.update({ coordinates: [lon, lat] }); return; }
        var dot = document.createElement('div');
        dot.className = 'pmap-dot';
        marker = new api.y.YMapMarker({
          coordinates: [lon, lat], draggable: true,
          onDragEnd: function(c){ o.onChange(c[1], c[0]); },
        }, dot);
        map.addChild(marker);
      }
      if(has) setPin(p.lat, p.lon);
      map.addChild(new api.y.YMapListener({
        layer: 'any',
        onClick: function(obj, ev){ var c = ev.coordinates; setPin(c[1], c[0]); o.onChange(c[1], c[0]); },
      }));
      return {
        setPin: setPin,
        center: function(lat, lon, zoom){ map.setLocation({ center: [lon, lat], zoom: zoom || 16 }); },
      };
    });
  }
  window.PMaps = { load: load, studio: studio, catalog: catalog, picker: picker };
})();
/* MP:END */
</script>
