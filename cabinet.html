<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Кабинет · Платформа фотостудий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --bg:#f1f2f4; --surface:#ffffff; --surface-2:#f7f8f9;
    --border:#e3e5e9; --border-strong:#cfd2d8;
    --text:#1c1e21; --text-2:#5a5f68; --text-3:#8a9099;
    --blue:#0a72ef; --blue-dark:#0559c4; --blue-bg:#eaf2fe;
    --orange:#f6821f;
    --green:#12864d; --green-bg:#e7f6ee;
    --red:#cf3a3a;
    --r:8px; --r-sm:6px;
    --shadow:0 1px 2px rgba(20,22,28,.06), 0 1px 3px rgba(20,22,28,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;
       min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--blue);text-decoration:none;} a:hover{text-decoration:underline;}
  [hidden]{display:none!important;}

  .wrap{max-width:520px;margin:0 auto;padding:44px 20px 60px;}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .brand .dot{width:18px;height:18px;border-radius:5px;background:var(--orange);}
  .brand h1{font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;}
  .sub{color:var(--text-2);font-size:13px;margin-bottom:24px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
        padding:22px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{font-weight:600;font-size:15px;margin:0 0 4px;}
  .card p{color:var(--text-2);font-size:13px;margin:0 0 16px;}

  .who{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .who img{width:42px;height:42px;border-radius:50%;background:var(--surface-2);object-fit:cover;
           border:1px solid var(--border);}
  .who .name{font-weight:600;font-size:15px;}
  .who .uid{font-family:var(--f-mono);font-size:11px;color:var(--text-3);}

  .studio{display:flex;align-items:center;justify-content:space-between;gap:12px;
          background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
          padding:13px 15px;margin-bottom:8px;color:inherit;}
  .studio:hover{border-color:var(--border-strong);background:var(--surface-2);text-decoration:none;}
  .studio .s-name{font-weight:600;font-size:14px;}
  .studio .s-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
  .badge{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;
         padding:3px 8px;border-radius:999px;border:1px solid var(--border-strong);
         color:var(--text-2);background:var(--surface-2);flex:0 0 auto;}
  .badge.owner{color:var(--blue-dark);border-color:#bcd8fb;background:var(--blue-bg);}
  .badge.draft{color:var(--text-3);}
  .badge.published{color:var(--green);border-color:#bfe3cd;background:var(--green-bg);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
       background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:var(--r-sm);
       padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--blue-dark);border-color:var(--blue-dark);}
  .btn.ghost{background:var(--surface);color:var(--text-2);border-color:var(--border-strong);}
  .muted{color:var(--text-2);font-size:12px;}
  .err{color:var(--red);font-size:13px;margin-top:10px;}
  .empty{color:var(--text-3);font-size:13px;padding:8px 0;}
  #tgLogin{margin-top:6px;min-height:44px;}

  /* Вход по номеру телефона (план «Телефон вместо Telegram», рядом с уже
     существующим Login Widget — добавляется, не заменяет). */
  .or-divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;
    color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;}
  .field input{width:100%;background:var(--surface);border:1px solid var(--border-strong);
    border-radius:var(--r-sm);color:var(--text);font:inherit;font-size:13px;padding:9px 11px;}
  .field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.full{width:100%;}
  .rowbtns{display:flex;gap:8px;margin-top:8px;}
  .rowbtns .btn{flex:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span><h1>Кабинет</h1></div>
  <div class="sub">Платформа фотостудий · управление студией из браузера</div>

  <div id="loading" class="card"><p style="margin:0">Загрузка…</p></div>

  <!-- ВХОД -->
  <div id="loginCard" class="card" hidden>
    <h2>Вход</h2>
    <p>Войдите через Telegram — тем же аккаунтом, что указан владельцем студии.</p>
    <div id="tgLogin"></div>
    <div id="loginErr" class="err" hidden></div>

    <div class="or-divider">или</div>

    <div id="phoneStep1">
      <div class="field">
        <label for="loginPhone">Номер телефона</label>
        <input id="loginPhone" type="tel" inputmode="numeric" placeholder="+375 (29) 123-45-67" value="+375 ">
      </div>
      <button class="btn full" id="phoneSendBtn" type="button" disabled>Получить код</button>
    </div>
    <div id="phoneStep2" hidden>
      <p class="muted" id="phoneHint" style="margin:0 0 10px"></p>
      <div class="field">
        <label for="loginCode">Код из Telegram или SMS</label>
        <input id="loginCode" type="tel" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      </div>
      <button class="btn full" id="phoneVerifyBtn" type="button" disabled>Подтвердить</button>
      <div class="rowbtns">
        <button class="btn ghost" id="phoneResendBtn" type="button">Отправить код ещё раз</button>
        <button class="btn ghost" id="phoneBackBtn" type="button">Назад</button>
      </div>
    </div>
    <div id="phoneErr" class="err" hidden></div>
  </div>

  <!-- КАБИНЕТ -->
  <div id="app" hidden>
    <div class="card">
      <div class="who">
        <img id="uPhoto" alt="">
        <div>
          <div class="name" id="uName">—</div>
          <div class="uid" id="uId"></div>
        </div>
      </div>
      <button class="btn ghost" id="logoutBtn" type="button">Выйти</button>
    </div>

    <div class="card">
      <h2>Мои студии</h2>
      <p>Студии, где вы владелец или администратор.</p>
      <div id="studios"><div class="empty">—</div></div>
    </div>

  </div>
</div>

<script>
(function(){
  var API_BASE = 'https://api.poont.space';
  var BOT = 'poontstudio_bot';
  var TOKEN_KEY = 'ps_cabinet_token';

  var $ = function(id){ return document.getElementById(id); };
  function show(el){ el.hidden = false; }
  function hide(el){ el.hidden = true; }

  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } }
  function setToken(t){ try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){} }

  function api(method, path, body, auth){
    var headers = { 'Content-Type': 'application/json' };
    if(auth){ var t = getToken(); if(t) headers['Authorization'] = 'Bearer ' + t; }
    return fetch(API_BASE + path, {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(data){
        if(!r.ok){ var e = new Error((data && data.error) || ('Ошибка ' + r.status)); e.status = r.status; throw e; }
        return data;
      });
    });
  }

  function roleLabel(role){ return role === 'owner' ? 'владелец' : 'админ'; }

  function renderApp(me, user){
    hide($('loading')); hide($('loginCard')); show($('app'));
    $('uName').textContent = (user && (user.firstName || user.username)) || ('id ' + me.userId);
    $('uId').textContent = 'id ' + me.userId + (user && user.username ? ' · @' + user.username : '');
    if(user && user.photoUrl){ $('uPhoto').src = user.photoUrl; } else { hide($('uPhoto')); }

    var box = $('studios');
    var list = me.memberships || [];
    if(!list.length){
      box.innerHTML = '<div class="empty">Вы пока не привязаны ни к одной студии. Попросите владельца добавить ваш Telegram ID.</div>';
    } else {
      box.innerHTML = '';
      list.forEach(function(m){
        var a = document.createElement('a');
        a.className = 'studio';
        a.href = './studio.html?id=' + encodeURIComponent(m.studioId);
        a.innerHTML =
          '<div><div class="s-name"></div><div class="s-sub"></div></div>' +
          '<span class="badge ' + (m.role === 'owner' ? 'owner' : '') + '"></span>';
        a.querySelector('.s-name').textContent = m.studioName || m.studioId;
        a.querySelector('.s-sub').textContent =
          [m.studioCity, roleLabel(m.role), m.studioStatus].filter(Boolean).join(' · ');
        a.querySelector('.badge').textContent = roleLabel(m.role);
        box.appendChild(a);
      });
    }
  }

  function loadMe(user){
    return api('GET', '/api/session/me', null, true).then(function(me){
      renderApp(me, user || me.user || null);
    });
  }

  // Login Widget -> callback
  window.onTelegramAuth = function(tgUser){
    var err = $('loginErr'); hide(err);
    api('POST', '/api/session', tgUser, false).then(function(res){
      setToken(res.token);
      return loadMe(res.user);
    }).catch(function(e){
      err.textContent = e.message || 'Не удалось войти';
      show(err);
    });
  };

  function mountLoginButton(){
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.setAttribute('data-telegram-login', BOT);
    s.setAttribute('data-size', 'large');
    s.setAttribute('data-userpic', 'false');
    s.setAttribute('data-onauth', 'onTelegramAuth(user)');
    $('tgLogin').appendChild(s);
  }

  $('logoutBtn').addEventListener('click', function(){
    api('POST', '/api/session/logout', null, true).catch(function(){});
    setToken('');
    location.reload();
  });

  // ---------- Вход по номеру телефона — рядом с Login Widget, не вместо
  // него (тот же /api/verify/start|check, что уже обслуживает клиентский
  // мини-апп; сессия — тот же signSession, что и у Telegram-входа выше). ----------
  function digitsAfterPrefix(raw){
    var d = raw.replace(/\D/g,'');
    if(d.indexOf('375')===0) d = d.slice(3);
    return d.slice(0,9);
  }
  function formatByPhone(raw){
    var d = digitsAfterPrefix(raw);
    var out = '+375';
    if(d.length>0) out += ' ('+d.slice(0,2);
    if(d.length>=2) out += ')';
    if(d.length>2) out += ' '+d.slice(2,5);
    if(d.length>5) out += '-'+d.slice(5,7);
    if(d.length>7) out += '-'+d.slice(7,9);
    return out;
  }
  function dDigitsBeforeCaret(rawValue, caretPos){
    var raw = rawValue.slice(0, caretPos).replace(/\D/g,'');
    if(raw.indexOf('375')===0) raw = raw.slice(3);
    else if('375'.indexOf(raw)===0) raw = '';
    return raw.length;
  }
  function caretPosForDDigitCount(formatted, target){
    if(target<=0) return 5;
    var seenPrefix=0, seenD=0;
    for(var i=0;i<formatted.length;i++){
      if(/\d/.test(formatted[i])){
        if(seenPrefix<3){ seenPrefix++; continue; }
        seenD++;
        if(seenD===target) return i+1;
      }
    }
    return formatted.length;
  }
  function toE164Phone(){ return '+375' + digitsAfterPrefix($('loginPhone').value); }

  $('loginPhone').addEventListener('focus', function(){
    if(!$('loginPhone').value) $('loginPhone').value = '+375 ';
  });
  $('loginPhone').addEventListener('input', function(){
    var el = $('loginPhone');
    var caret = el.selectionStart;
    var target = dDigitsBeforeCaret(el.value, caret);
    el.value = formatByPhone(el.value);
    var newPos = caretPosForDDigitCount(el.value, target);
    el.setSelectionRange(newPos, newPos);
    $('phoneSendBtn').disabled = digitsAfterPrefix(el.value).length !== 9;
  });

  var resendAt = 0, resendTimer = null;
  function tickResend(){
    clearTimeout(resendTimer);
    var left = Math.ceil((resendAt - Date.now())/1000);
    var btn = $('phoneResendBtn');
    if(left > 0){
      btn.disabled = true;
      btn.textContent = 'Отправить код ещё раз (' + left + ')';
      resendTimer = setTimeout(tickResend, 1000);
    } else {
      btn.disabled = false;
      btn.textContent = 'Отправить код ещё раз';
    }
  }
  function startResendCooldown(sec){ resendAt = Date.now() + sec*1000; tickResend(); }
  function resetResendBtn(){
    clearTimeout(resendTimer); resendAt = 0;
    $('phoneResendBtn').disabled = false;
    $('phoneResendBtn').textContent = 'Отправить код ещё раз';
  }

  function requestCode(){
    return fetch(API_BASE + '/api/verify/start', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ phone: toE164Phone() }),
    }).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(data){
        if(!r.ok){
          var e = new Error((data && data.error) || 'Не удалось отправить код');
          if(data && typeof data.retryAfterSec === 'number') e.retryAfterSec = data.retryAfterSec;
          throw e;
        }
        return data;
      });
    });
  }
  function handleCodeSendError(e){
    var err = $('phoneErr'); err.textContent = e.message; show(err);
    if(typeof e.retryAfterSec === 'number' && e.retryAfterSec > 0) startResendCooldown(e.retryAfterSec);
    else resetResendBtn();
  }

  $('phoneSendBtn').addEventListener('click', function(){
    if($('phoneSendBtn').disabled) return;
    hide($('phoneErr'));
    $('phoneHint').textContent = 'Код придёт в Telegram или SMS на ' + formatByPhone(toE164Phone());
    $('loginCode').value = '';
    $('phoneVerifyBtn').disabled = true;
    hide($('phoneStep1')); show($('phoneStep2'));
    resetResendBtn();
    requestCode().then(function(){ startResendCooldown(60); }).catch(handleCodeSendError);
  });

  $('phoneResendBtn').addEventListener('click', function(){
    if($('phoneResendBtn').disabled) return;
    hide($('phoneErr'));
    requestCode().then(function(){ startResendCooldown(60); }).catch(handleCodeSendError);
  });

  $('phoneBackBtn').addEventListener('click', function(){
    hide($('phoneStep2')); show($('phoneStep1')); hide($('phoneErr'));
    resetResendBtn();
  });

  $('loginCode').addEventListener('input', function(){
    var el = $('loginCode');
    el.value = el.value.replace(/\D/g,'').slice(0,6);
    $('phoneVerifyBtn').disabled = el.value.length !== 6;
  });

  $('phoneVerifyBtn').addEventListener('click', function(){
    if($('phoneVerifyBtn').disabled) return;
    hide($('phoneErr'));
    $('phoneVerifyBtn').disabled = true;
    $('phoneVerifyBtn').textContent = 'Проверяем…';
    fetch(API_BASE + '/api/verify/check', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ phone: toE164Phone(), code: $('loginCode').value.trim() }),
    }).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(data){
        if(!r.ok) throw new Error((data && data.error) || 'Неверный код');
        return data;
      });
    }).then(function(res){
      setToken(res.token);
      return loadMe(null);
    }).catch(function(e){
      var err = $('phoneErr'); err.textContent = e.message; show(err);
    }).finally(function(){
      $('phoneVerifyBtn').disabled = $('loginCode').value.length !== 6;
      $('phoneVerifyBtn').textContent = 'Подтвердить';
    });
  });

  // старт
  if(getToken()){
    loadMe(null).catch(function(){
      setToken('');
      hide($('loading')); show($('loginCard')); mountLoginButton();
    });
  } else {
    hide($('loading')); show($('loginCard')); mountLoginButton();
  }
})();
</script>
</body>
</html>
