<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Кабинет · Платформа фотостудий</title>
<style>
  :root{
    --bg:#14110F; --surface:#1E1A17; --surface-raised:#262019; --line:#332920;
    --amber:#E8A33D; --amber-dim:#6b4d21; --red:#C1443C; --good:#3B7355;
    --text:#F2ECE4; --muted:#8A8078; --muted-dim:#4f4842;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh; line-height:1.5;
  }
  .wrap{max-width:560px; margin:0 auto; padding:28px 20px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);}
  .brand h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;margin:0;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:26px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;}
  .card h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;margin:0 0 4px;}
  .card p{color:var(--muted);font-size:13px;margin:0 0 14px;}

  .who{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .who img{width:44px;height:44px;border-radius:50%;background:var(--surface-raised);object-fit:cover;}
  .who .name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;}
  .who .uid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted-dim);}

  .studio{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--surface-raised);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;margin-bottom:8px;text-decoration:none;color:inherit;
  }
  .studio .s-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;}
  .studio .s-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);flex:0 0 auto;
  }
  .badge.owner{color:var(--amber);border-color:var(--amber-dim);}
  .badge.draft{color:var(--muted-dim);}
  .badge.published{color:var(--good);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--amber);color:#1a1208;border:none;border-radius:10px;
    padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .muted{color:var(--muted);font-size:12px;}
  .err{color:var(--red);font-size:13px;margin-top:10px;}
  .empty{color:var(--muted);font-size:13px;padding:8px 0;}
  #tgLogin{margin-top:6px;min-height:44px;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span><h1>Кабинет</h1></div>
  <div class="sub">Платформа фотостудий · управление студией из браузера</div>

  <div id="loading" class="card"><p style="margin:0">Загрузка…</p></div>

  <!-- ВХОД -->
  <div id="loginCard" class="card" hidden>
    <h2>Вход</h2>
    <p>Войдите через Telegram — тем же аккаунтом, что указан владельцем студии.</p>
    <div id="tgLogin"></div>
    <div id="loginErr" class="err" hidden></div>
  </div>

  <!-- КАБИНЕТ -->
  <div id="app" hidden>
    <div class="card">
      <div class="who">
        <img id="uPhoto" alt="">
        <div>
          <div class="name" id="uName">—</div>
          <div class="uid" id="uId"></div>
        </div>
      </div>
      <button class="btn ghost" id="logoutBtn" type="button">Выйти</button>
    </div>

    <div class="card">
      <h2>Мои студии</h2>
      <p>Студии, где вы владелец или администратор.</p>
      <div id="studios"><div class="empty">—</div></div>
    </div>

  </div>
</div>

<script>
(function(){
  var API_BASE = 'https://photostudio-backend-yehh.onrender.com';
  var BOT = 'poontstudio_bot';
  var TOKEN_KEY = 'ps_cabinet_token';

  var $ = function(id){ return document.getElementById(id); };
  function show(el){ el.hidden = false; }
  function hide(el){ el.hidden = true; }

  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } }
  function setToken(t){ try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){} }

  function api(method, path, body, auth){
    var headers = { 'Content-Type': 'application/json' };
    if(auth){ var t = getToken(); if(t) headers['Authorization'] = 'Bearer ' + t; }
    return fetch(API_BASE + path, {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(data){
        if(!r.ok){ var e = new Error((data && data.error) || ('Ошибка ' + r.status)); e.status = r.status; throw e; }
        return data;
      });
    });
  }

  function roleLabel(role){ return role === 'owner' ? 'владелец' : 'админ'; }

  function renderApp(me, user){
    hide($('loading')); hide($('loginCard')); show($('app'));
    $('uName').textContent = (user && (user.firstName || user.username)) || ('id ' + me.userId);
    $('uId').textContent = 'id ' + me.userId + (user && user.username ? ' · @' + user.username : '');
    if(user && user.photoUrl){ $('uPhoto').src = user.photoUrl; } else { hide($('uPhoto')); }

    var box = $('studios');
    var list = me.memberships || [];
    if(!list.length){
      box.innerHTML = '<div class="empty">Вы пока не привязаны ни к одной студии. Попросите владельца добавить ваш Telegram ID.</div>';
    } else {
      box.innerHTML = '';
      list.forEach(function(m){
        var a = document.createElement('a');
        a.className = 'studio';
        a.href = './studio.html?id=' + encodeURIComponent(m.studioId);
        a.innerHTML =
          '<div><div class="s-name"></div><div class="s-sub"></div></div>' +
          '<span class="badge ' + (m.role === 'owner' ? 'owner' : '') + '"></span>';
        a.querySelector('.s-name').textContent = m.studioName || m.studioId;
        a.querySelector('.s-sub').textContent =
          [m.studioCity, roleLabel(m.role), m.studioStatus].filter(Boolean).join(' · ');
        a.querySelector('.badge').textContent = roleLabel(m.role);
        box.appendChild(a);
      });
    }
  }

  function loadMe(user){
    return api('GET', '/api/session/me', null, true).then(function(me){
      renderApp(me, user || me.user || null);
    });
  }

  // Login Widget -> callback
  window.onTelegramAuth = function(tgUser){
    var err = $('loginErr'); hide(err);
    api('POST', '/api/session', tgUser, false).then(function(res){
      setToken(res.token);
      return loadMe(res.user);
    }).catch(function(e){
      err.textContent = e.message || 'Не удалось войти';
      show(err);
    });
  };

  function mountLoginButton(){
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.setAttribute('data-telegram-login', BOT);
    s.setAttribute('data-size', 'large');
    s.setAttribute('data-userpic', 'false');
    s.setAttribute('data-onauth', 'onTelegramAuth(user)');
    $('tgLogin').appendChild(s);
  }

  $('logoutBtn').addEventListener('click', function(){
    api('POST', '/api/session/logout', null, true).catch(function(){});
    setToken('');
    location.reload();
  });

  // старт
  if(getToken()){
    loadMe(null).catch(function(){
      setToken('');
      hide($('loading')); show($('loginCard')); mountLoginButton();
    });
  } else {
    hide($('loading')); show($('loginCard')); mountLoginButton();
  }
})();
</script>
</body>
</html>
