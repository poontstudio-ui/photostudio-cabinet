<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Кабинет платформы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --bg:#f1f2f4; --surface:#ffffff; --surface-2:#f7f8f9;
    --border:#e3e5e9; --border-strong:#cfd2d8;
    --text:#1c1e21; --text-2:#5a5f68; --text-3:#8a9099;
    --blue:#0a72ef; --blue-dark:#0559c4; --blue-bg:#eaf2fe;
    --orange:#f6821f;
    --green:#12864d; --green-bg:#e7f6ee;
    --red:#cf3a3a; --red-bg:#fce9e9;
    --amber:#9a6400; --amber-bg:#fdf3e2;
    --r:8px; --r-sm:6px;
    --shadow:0 1px 2px rgba(20,22,28,.06), 0 1px 3px rgba(20,22,28,.04);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;
       min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--blue);text-decoration:none;} a:hover{text-decoration:underline;}
  [hidden]{display:none!important;}

  .wrap{max-width:1000px;margin:0 auto;padding:26px 30px 90px;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
  .top a.back{color:var(--text-3);font-size:18px;}
  .top h1{font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;}
  .sub{color:var(--text-2);font-size:13px;margin-bottom:22px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
        padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card h2{font-weight:600;font-size:15px;margin:0 0 14px;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;}
  .tile{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
        padding:14px 16px;}
  .tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .tile .l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
  .tile.warn .v{color:var(--amber);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--border);}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;
     background:var(--surface-2);}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
  .scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm);}

  .badge{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;
         padding:3px 8px;border-radius:999px;border:1px solid var(--border-strong);
         color:var(--text-2);background:var(--surface-2);white-space:nowrap;}
  .badge.published{color:var(--green);border-color:#bfe3cd;background:var(--green-bg);}
  .badge.draft{color:var(--amber);border-color:#e7d4ac;background:var(--amber-bg);}
  .badge.suspended{color:var(--red);border-color:#f0c9c9;background:var(--red-bg);}

  .btn{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-2);
       border-radius:var(--r-sm);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;
       font-family:inherit;white-space:nowrap;}
  .btn:hover{background:var(--surface-2);color:var(--text);}
  .btn.go{border-color:#bfe3cd;color:var(--green);background:var(--green-bg);}
  .btn.stop{border-color:#f0c9c9;color:var(--red);background:var(--red-bg);}
  .rowbtns{display:flex;gap:6px;flex-wrap:wrap;}
  .muted{color:var(--text-2);font-size:12px;}
  .err{color:var(--red);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./cabinet.html">←</a>
    <h1>Кабинет платформы</h1>
  </div>
  <div class="sub">Дашборд и модерация студий</div>

  <div id="loading" class="card"><span class="muted">Загрузка…</span></div>
  <div id="denied" class="card" hidden><span class="err" id="deniedMsg"></span></div>

  <div id="app" hidden>
    <div class="card">
      <h2>Сводка</h2>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="card">
      <h2>По городам</h2>
      <div class="scroll"><table id="cityTable">
        <thead><tr><th>Город</th><th class="num">Студий</th><th class="num">Активных броней</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>

    <div class="card">
      <h2>Студии <span class="muted" id="studioCount"></span></h2>
      <div class="scroll"><table id="studioTable">
        <thead><tr>
          <th>Студия</th><th>Статус</th><th class="num">Залы</th><th class="num">Брони</th><th class="num">Команда</th><th>Действия</th>
        </tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="muted" id="modNote" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var API_BASE = 'https://api.poont.space';
  var TOKEN_KEY = 'ps_cabinet_token';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var token = (function(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } })();
  var STATUS_RU = { published:'опубликована', draft:'черновик', suspended:'приостановлена' };

  function api(method, path, body){
    return fetch(API_BASE + path, {
      method: method,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(d){
        if(!r.ok){ var e = new Error((d && d.error) || ('Ошибка ' + r.status)); e.status = r.status; throw e; }
        return d;
      });
    });
  }
  function money(minor, cur){ return (Number(minor)/100).toLocaleString('ru-RU') + ' ' + cur; }

  function renderOverview(ov){
    var s = ov.studios || {}, b = ov.bookings || {};
    var tiles = [
      { v: (s.published||0), l: 'Опубликовано' },
      { v: (s.draft||0), l: 'На модерации', warn: (s.draft||0) > 0 },
      { v: (s.suspended||0), l: 'Приостановлено' },
      { v: (b.active||0), l: 'Активных броней' },
      { v: (b.cancelled||0), l: 'Отменённых броней' },
      { v: (ov.users||0), l: 'Пользователей' }
    ];
    (ov.gmv || []).forEach(function(g){ tiles.push({ v: money(g.minor, g.currency), l: 'GMV · ' + g.currency }); });
    $('tiles').innerHTML = tiles.map(function(t){
      return '<div class="tile' + (t.warn ? ' warn' : '') + '"><div class="v">' + esc(t.v) + '</div><div class="l">' + esc(t.l) + '</div></div>';
    }).join('');

    var tb = $('cityTable').querySelector('tbody');
    tb.innerHTML = (ov.byCity || []).map(function(c){
      return '<tr><td>' + esc(c.city) + '</td><td class="num">' + esc(c.studios) + '</td><td class="num">' + esc(c.activeBookings) + '</td></tr>';
    }).join('') || '<tr><td colspan="3" class="muted">нет данных</td></tr>';
  }

  function actionsFor(st){
    // [{status, label, cls}]
    if(st === 'draft') return [{s:'published',t:'Опубликовать',c:'go'},{s:'suspended',t:'Отклонить',c:'stop'}];
    if(st === 'published') return [{s:'suspended',t:'Приостановить',c:'stop'}];
    if(st === 'suspended') return [{s:'published',t:'Вернуть',c:'go'}];
    return [];
  }

  function renderStudios(list){
    $('studioCount').textContent = '· ' + list.length;
    var tb = $('studioTable').querySelector('tbody');
    tb.innerHTML = '';
    list.forEach(function(s){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><a href="./studio.html?id=' + encodeURIComponent(s.id) + '">' + esc(s.name || s.id) + '</a>' +
          '<div class="muted">' + esc(s.city || '') + '</div></td>' +
        '<td><span class="badge ' + esc(s.status) + '">' + esc(STATUS_RU[s.status] || s.status) + '</span></td>' +
        '<td class="num">' + esc(s.halls) + '</td>' +
        '<td class="num">' + esc(s.activeBookings) + '</td>' +
        '<td class="num">' + esc(s.members) + '</td>' +
        '<td class="rowbtns"></td>';
      var cell = tr.querySelector('.rowbtns');
      actionsFor(s.status).forEach(function(a){
        var btn = document.createElement('button');
        btn.className = 'btn ' + a.c; btn.textContent = a.t;
        btn.addEventListener('click', function(){
          if(!confirm('Студия «' + (s.name || s.id) + '» → ' + (STATUS_RU[a.s] || a.s) + '?')) return;
          cell.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
          api('POST', '/api/platform/studios/' + encodeURIComponent(s.id) + '/status', { status: a.s })
            .then(function(){ $('modNote').textContent = '«' + (s.name || s.id) + '» → ' + (STATUS_RU[a.s] || a.s); load(); })
            .catch(function(e){ $('modNote').textContent = e.message; cell.querySelectorAll('button').forEach(function(x){ x.disabled = false; }); });
        });
        cell.appendChild(btn);
      });
      tb.appendChild(tr);
    });
  }

  function load(){
    return Promise.all([ api('GET','/api/platform/overview'), api('GET','/api/platform/studios') ])
      .then(function(r){ renderOverview(r[0]); renderStudios(r[1]); });
  }

  function boot(){
    if(!token){ location.href = './cabinet.html'; return; }
    // проверяем права через /session/me, потом грузим
    api('GET','/api/session/me')
      .then(function(me){
        if(!me.platformAdmin){ var e = new Error('not platform admin'); e.status = 403; throw e; }
        return load();
      })
      .then(function(){ $('loading').hidden = true; $('app').hidden = false; })
      .catch(function(e){
        $('loading').hidden = true; $('denied').hidden = false;
        if(e.status === 401){
          $('deniedMsg').textContent = 'Сессия истекла — войдите заново.';
          try{ localStorage.removeItem(TOKEN_KEY); }catch(x){}
          setTimeout(function(){ location.href = './cabinet.html'; }, 1200);
        } else if(e.status === 403){
          $('deniedMsg').textContent = 'Доступ только для платформенного администратора.';
        } else {
          $('deniedMsg').textContent = e.message || 'Не удалось загрузить.';
        }
      });
  }
  boot();
})();
</script>
</body>
</html>
