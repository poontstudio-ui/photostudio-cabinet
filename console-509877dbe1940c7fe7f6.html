<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Кабинет платформы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
  /* Шрифты. ВСЕ ТРИ обязаны нести кириллицу — прежние Barlow Condensed и
     Work Sans её не содержат и молча падали в системный фолбэк. */
  --f-display:'Fira Sans Condensed','Roboto Condensed',system-ui,sans-serif;
  --f-body:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --bg:#14110F; --surface:#1E1A17; --surface-raised:#262019; --line:#332920;
    --amber:#E8A33D; --amber-dim:#6b4d21; --red:#C1443C; --good:#3B7355;
    --text:#F2ECE4; --muted:#8A8078; --muted-dim:#4f4842;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--f-body);min-height:100vh;line-height:1.5;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px;}
  a{color:var(--amber);text-decoration:none;}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .top a.back{color:var(--muted);font-size:20px;}
  .top h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;}
  .sub{color:var(--muted);font-size:12px;margin-bottom:22px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .card h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 12px;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .tile{background:var(--surface-raised);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .tile .v{font-family:var(--f-display);font-weight:700;font-size:22px;}
  .tile .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .tile.warn .v{color:var(--amber);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;}
  td.num,th.num{text-align:right;font-family:var(--f-mono);}
  .scroll{overflow-x:auto;}

  .badge{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
  .badge.published{color:var(--good);border-color:#2c4d3d;}
  .badge.draft{color:var(--amber);border-color:var(--amber-dim);}
  .badge.suspended{color:var(--red);border-color:#5c261f;}

  .btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .btn.go{border-color:var(--amber-dim);color:var(--amber);}
  .btn.stop{border-color:#5c261f;color:var(--red);}
  .rowbtns{display:flex;gap:6px;flex-wrap:wrap;}
  .muted{color:var(--muted);font-size:12px;}
  .err{color:var(--red);font-size:13px;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./cabinet.html">←</a>
    <h1>Кабинет платформы</h1>
  </div>
  <div class="sub">Дашборд и модерация студий</div>

  <div id="loading" class="card"><span class="muted">Загрузка…</span></div>
  <div id="denied" class="card" hidden><span class="err" id="deniedMsg"></span></div>

  <div id="app" hidden>
    <div class="card">
      <h2>Сводка</h2>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="card">
      <h2>По городам</h2>
      <div class="scroll"><table id="cityTable">
        <thead><tr><th>Город</th><th class="num">Студий</th><th class="num">Активных броней</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>

    <div class="card">
      <h2>Студии <span class="muted" id="studioCount"></span></h2>
      <div class="scroll"><table id="studioTable">
        <thead><tr>
          <th>Студия</th><th>Статус</th><th class="num">Залы</th><th class="num">Брони</th><th class="num">Команда</th><th>Действия</th>
        </tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="muted" id="modNote" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var API_BASE = 'https://photostudio-backend-yehh.onrender.com';
  var TOKEN_KEY = 'ps_cabinet_token';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var token = (function(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } })();
  var STATUS_RU = { published:'опубликована', draft:'черновик', suspended:'приостановлена' };

  function api(method, path, body){
    return fetch(API_BASE + path, {
      method: method,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(d){
        if(!r.ok){ var e = new Error((d && d.error) || ('Ошибка ' + r.status)); e.status = r.status; throw e; }
        return d;
      });
    });
  }
  function money(minor, cur){ return (Number(minor)/100).toLocaleString('ru-RU') + ' ' + cur; }

  function renderOverview(ov){
    var s = ov.studios || {}, b = ov.bookings || {};
    var tiles = [
      { v: (s.published||0), l: 'Опубликовано' },
      { v: (s.draft||0), l: 'На модерации', warn: (s.draft||0) > 0 },
      { v: (s.suspended||0), l: 'Приостановлено' },
      { v: (b.active||0), l: 'Активных броней' },
      { v: (b.cancelled||0), l: 'Отменённых броней' },
      { v: (ov.users||0), l: 'Пользователей' }
    ];
    (ov.gmv || []).forEach(function(g){ tiles.push({ v: money(g.minor, g.currency), l: 'GMV · ' + g.currency }); });
    $('tiles').innerHTML = tiles.map(function(t){
      return '<div class="tile' + (t.warn ? ' warn' : '') + '"><div class="v">' + esc(t.v) + '</div><div class="l">' + esc(t.l) + '</div></div>';
    }).join('');

    var tb = $('cityTable').querySelector('tbody');
    tb.innerHTML = (ov.byCity || []).map(function(c){
      return '<tr><td>' + esc(c.city) + '</td><td class="num">' + esc(c.studios) + '</td><td class="num">' + esc(c.activeBookings) + '</td></tr>';
    }).join('') || '<tr><td colspan="3" class="muted">нет данных</td></tr>';
  }

  function actionsFor(st){
    // [{status, label, cls}]
    if(st === 'draft') return [{s:'published',t:'Опубликовать',c:'go'},{s:'suspended',t:'Отклонить',c:'stop'}];
    if(st === 'published') return [{s:'suspended',t:'Приостановить',c:'stop'}];
    if(st === 'suspended') return [{s:'published',t:'Вернуть',c:'go'}];
    return [];
  }

  function renderStudios(list){
    $('studioCount').textContent = '· ' + list.length;
    var tb = $('studioTable').querySelector('tbody');
    tb.innerHTML = '';
    list.forEach(function(s){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><a href="./studio.html?id=' + encodeURIComponent(s.id) + '">' + esc(s.name || s.id) + '</a>' +
          '<div class="muted">' + esc(s.city || '') + '</div></td>' +
        '<td><span class="badge ' + esc(s.status) + '">' + esc(STATUS_RU[s.status] || s.status) + '</span></td>' +
        '<td class="num">' + esc(s.halls) + '</td>' +
        '<td class="num">' + esc(s.activeBookings) + '</td>' +
        '<td class="num">' + esc(s.members) + '</td>' +
        '<td class="rowbtns"></td>';
      var cell = tr.querySelector('.rowbtns');
      actionsFor(s.status).forEach(function(a){
        var btn = document.createElement('button');
        btn.className = 'btn ' + a.c; btn.textContent = a.t;
        btn.addEventListener('click', function(){
          if(!confirm('Студия «' + (s.name || s.id) + '» → ' + (STATUS_RU[a.s] || a.s) + '?')) return;
          cell.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
          api('POST', '/api/platform/studios/' + encodeURIComponent(s.id) + '/status', { status: a.s })
            .then(function(){ $('modNote').textContent = '«' + (s.name || s.id) + '» → ' + (STATUS_RU[a.s] || a.s); load(); })
            .catch(function(e){ $('modNote').textContent = e.message; cell.querySelectorAll('button').forEach(function(x){ x.disabled = false; }); });
        });
        cell.appendChild(btn);
      });
      tb.appendChild(tr);
    });
  }

  function load(){
    return Promise.all([ api('GET','/api/platform/overview'), api('GET','/api/platform/studios') ])
      .then(function(r){ renderOverview(r[0]); renderStudios(r[1]); });
  }

  function boot(){
    if(!token){ location.href = './cabinet.html'; return; }
    // проверяем права через /session/me, потом грузим
    api('GET','/api/session/me')
      .then(function(me){
        if(!me.platformAdmin){ var e = new Error('not platform admin'); e.status = 403; throw e; }
        return load();
      })
      .then(function(){ $('loading').hidden = true; $('app').hidden = false; })
      .catch(function(e){
        $('loading').hidden = true; $('denied').hidden = false;
        if(e.status === 401){
          $('deniedMsg').textContent = 'Сессия истекла — войдите заново.';
          try{ localStorage.removeItem(TOKEN_KEY); }catch(x){}
          setTimeout(function(){ location.href = './cabinet.html'; }, 1200);
        } else if(e.status === 403){
          $('deniedMsg').textContent = 'Доступ только для платформенного администратора.';
        } else {
          $('deniedMsg').textContent = e.message || 'Не удалось загрузить.';
        }
      });
  }
  boot();
})();
</script>
</body>
</html>
